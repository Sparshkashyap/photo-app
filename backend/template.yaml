AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: Serverless backend for Photo App

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 180
    MemorySize: 512

    Environment:
      Variables:

        # ==================================================
        # DYNAMODB
        # ==================================================

        DYNAMODB_TABLE: PhotoTable

        FOLDER_TABLE: FolderTable

        USERS_TABLE_NAME: UsersTable

        # ==================================================
        # S3
        # ==================================================

        S3_BUCKET_NAME: !Ref PhotosBucket

        # ==================================================
        # JWT
        # ==================================================

        JWT_EXPIRES_IN: "1d"

        GOOGLE_REDIRECT_URI: "https://y181ertste.execute-api.ap-south-1.amazonaws.com/auth/google/callback"

        # ==================================================
        # SHARE LINKS
        # ==================================================

        SHARE_TABLE_NAME: !Ref ShareTable

        # ==================================================
        # FRONTEND
        # ==================================================

        FRONTEND_URL: "https://main.ddvgp5hdlanze.amplifyapp.com"

        # ==================================================
        # AI SERVICE
        # ==================================================

        AI_SERVICE_URL: "https://6jqxmedvf37drmktyotegapcg40cyijp.lambda-url.ap-south-1.on.aws"

        # ==================================================
        # GOOGLE OAUTH
        # ==================================================

        # Google OAuth callback URL is also configured above.


Resources:

  # ==================================================
  # API GATEWAY
  # ==================================================

  PhotoApi:
    Type: AWS::Serverless::HttpApi

    Properties:

      CorsConfiguration:

        AllowOrigins:
          - "*"

        AllowHeaders:
          - Content-Type
          - Authorization

        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS


  # ==================================================
  # MAIN API LAMBDA
  # ==================================================

  PhotoAppFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: .

      Handler: lambda.handler

      Policies:

        # ==================================================
        # DYNAMODB
        # ==================================================

        - Statement:

            Effect: Allow

            Action:

              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan

            Resource:

              # PhotoTable
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable/index/*"

              # FolderTable
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable/index/*"

              # UsersTable
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable/index/*"

              # ShareTable
              - !GetAtt ShareTable.Arn

              - !Sub "${ShareTable.Arn}/index/*"


        # ==================================================
        # S3
        # ==================================================

        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket


        # ==================================================
        # SSM PARAMETER STORE
        # ==================================================

        - Statement:

            Effect: Allow

            Action:

              - ssm:GetParameter

            Resource:

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/JWT_SECRET"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/MONGO_URI"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/GOOGLE_CLIENT_ID"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/GOOGLE_CLIENT_SECRET"


      # ==================================================
      # API ROUTES
      # ==================================================

      Events:

        # ------------------------------------------
        # Root
        # ------------------------------------------

        Root:
          Type: HttpApi

          Properties:

            ApiId: !Ref PhotoApi

            Path: /

            Method: ANY


        # ------------------------------------------
        # Proxy
        # ------------------------------------------

        Proxy:
          Type: HttpApi

          Properties:

            ApiId: !Ref PhotoApi

            Path: /{proxy+}

            Method: ANY


  # ==================================================
  # BACKGROUND AI CAPTION WORKER
  # ==================================================

  CaptionWorkerFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: .

      Handler: lambda.handler

      # IMPORTANT:
      # Override the global S3_BUCKET_NAME reference here.
      # The actual bucket name is read directly from the S3 event
      # inside lambda.js / photoController.js.
      Environment:
        Variables:

          S3_BUCKET_NAME: ""

      Policies:

        # ==================================================
        # DYNAMODB
        # ==================================================

        - Statement:

            Effect: Allow

            Action:

              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem

            Resource:

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable/index/*"


        # ==================================================
        # S3 READ
        # ==================================================

        - Statement:

            Effect: Allow

            Action:

              - s3:GetObject
              - s3:GetObjectVersion

            Resource:

              - "arn:aws:s3:::*/*"


        # ==================================================
        # SSM PARAMETER STORE
        # ==================================================

        - Statement:

            Effect: Allow

            Action:

              - ssm:GetParameter

            Resource:

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/JWT_SECRET"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/MONGO_URI"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/GOOGLE_CLIENT_ID"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/GOOGLE_CLIENT_SECRET"


      # ==================================================
      # S3 EVENT
      # ==================================================

      Events:

        CaptionWorker:
          Type: S3

          Properties:

            Bucket: !Ref PhotosBucket

            Events:

              - s3:ObjectCreated:Put

            Filter:

              S3Key:

                Rules:

                  - Name: prefix
                    Value: photos/


  # ==================================================
  # SHARE LINKS TABLE
  # ==================================================

  ShareTable:
    Type: AWS::DynamoDB::Table

    Properties:

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: shareId
          AttributeType: S

        - AttributeName: token
          AttributeType: S

      KeySchema:

        - AttributeName: shareId
          KeyType: HASH

      GlobalSecondaryIndexes:

        - IndexName: token-index

          KeySchema:

            - AttributeName: token
              KeyType: HASH

          Projection:

            ProjectionType: ALL

      TimeToLiveSpecification:

        AttributeName: ttl

        Enabled: true


  # ==================================================
  # S3 PHOTO STORAGE
  # ==================================================

  PhotosBucket:
    Type: AWS::S3::Bucket

    Properties:

      # ------------------------------------------------
      # PRIVATE BUCKET
      # ------------------------------------------------

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true


      # ------------------------------------------------
      # S3 CORS
      # ------------------------------------------------

      CorsConfiguration:

        CorsRules:

          - AllowedOrigins:

              - "*"

            AllowedMethods:

              - GET
              - PUT

            AllowedHeaders:

              - "*"

            ExposedHeaders:

              - ETag


# ==================================================
# OUTPUTS
# ==================================================

Outputs:

  # ==================================================
  # API GATEWAY URL
  # ==================================================

  ApiUrl:

    Description: API Gateway URL

    Value: !Sub "https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com"


  # ==================================================
  # DYNAMODB
  # ==================================================

  PhotoTable:

    Description: Existing DynamoDB Photo Metadata Table

    Value: "PhotoTable"


  FolderTable:

    Description: Existing DynamoDB Folder Metadata Table

    Value: "FolderTable"


  UsersTable:

    Description: Existing DynamoDB Users Table

    Value: "UsersTable"


  ShareTable:

    Description: DynamoDB table used for photo share links

    Value: !Ref ShareTable


  # ==================================================
  # S3
  # ==================================================

  PhotosBucket:

    Description: S3 Photo Storage Bucket

    Value: !Ref PhotosBucket