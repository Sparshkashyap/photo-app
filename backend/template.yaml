AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: Serverless backend for Photo App

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 20
    MemorySize: 512

    Environment:
      Variables:

        # ==================================================
        # DYNAMODB
        # ==================================================

        # Existing manually created DynamoDB table
        DYNAMODB_TABLE: PhotoTable

        # Existing manually created Folder table
        FOLDER_TABLE: FolderTable

        # Existing manually created Users table
        USERS_TABLE_NAME: UsersTable

        # ==================================================
        # S3
        # ==================================================

        # S3 bucket managed by this SAM stack
        S3_BUCKET_NAME: !Ref PhotosBucket

        # ==================================================
        # JWT
        # ==================================================

        JWT_EXPIRES_IN: "1d"


        GOOGLE_REDIRECT_URI: "https://y181ertste.execute-api.ap-south-1.amazonaws.com/auth/google/callback"

        # ==================================================
        # SHARE LINKS
        # ==================================================

        # CloudFormation-managed ShareTable
        SHARE_TABLE_NAME: !Ref ShareTable

        # ==================================================
        # FRONTEND
        # ==================================================

        # Local frontend URL
        #
        # Change this to your Vercel frontend URL
        # when deploying the production frontend.
        #
        FRONTEND_URL: "https://main.ddvgp5hdlanze.amplifyapp.com"

        # ==================================================
        # GOOGLE OAUTH
        # ==================================================

        # Google OAuth callback URL
        #
        # This URL MUST also be added to:
        #
        # Google Cloud Console
        # -> APIs & Services
        # -> Credentials
        # -> OAuth 2.0 Client ID
        # -> Authorized redirect URIs
        #
        
Resources:

  # ==================================================
  # API GATEWAY
  # ==================================================

  PhotoApi:
    Type: AWS::Serverless::HttpApi

    Properties:

      CorsConfiguration:

        AllowOrigins:
          - "*"

        AllowHeaders:
          - Content-Type
          - Authorization

        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  # ==================================================
  # LAMBDA
  # ==================================================

  PhotoAppFunction:
    Type: AWS::Serverless::Function

    Properties:

      CodeUri: .

      Handler: lambda.handler

      Policies:

        # ==================================================
        # DYNAMODB
        # ==================================================

        - Statement:

            Effect: Allow

            Action:

              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan

            Resource:

              # ------------------------------------------
              # PhotoTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable/index/*"

              # ------------------------------------------
              # FolderTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable/index/*"

              # ------------------------------------------
              # UsersTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable/index/*"

              # ------------------------------------------
              # ShareTable
              # ------------------------------------------

              - !GetAtt ShareTable.Arn

              - !Sub "${ShareTable.Arn}/index/*"

        # ==================================================
        # S3
        # ==================================================

        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket

        # ==================================================
        # SSM PARAMETER STORE
        # ==================================================

        - Statement:

            Effect: Allow

            Action:

              - ssm:GetParameter

            Resource:

              # ------------------------------------------
              # JWT
              # ------------------------------------------

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/JWT_SECRET"

              # ------------------------------------------
              # Existing Mongo URI
              # ------------------------------------------

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/MONGO_URI"

              # ------------------------------------------
              # Google OAuth Client ID
              # ------------------------------------------

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/GOOGLE_CLIENT_ID"

              # ------------------------------------------
              # Google OAuth Client Secret
              # ------------------------------------------

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/GOOGLE_CLIENT_SECRET"

      # ==================================================
      # API ROUTES
      # ==================================================

      Events:

        # ------------------------------------------
        # Root
        # ------------------------------------------

        Root:
          Type: HttpApi

          Properties:

            ApiId: !Ref PhotoApi

            Path: /

            Method: ANY

        # ------------------------------------------
        # Proxy
        # ------------------------------------------

        Proxy:
          Type: HttpApi

          Properties:

            ApiId: !Ref PhotoApi

            Path: /{proxy+}

            Method: ANY

  # ==================================================
  # SHARE LINKS TABLE
  # ==================================================

  ShareTable:
    Type: AWS::DynamoDB::Table

    Properties:

      # ------------------------------------------------
      # CloudFormation generates physical table name
      # ------------------------------------------------

      BillingMode: PAY_PER_REQUEST

      # ------------------------------------------------
      # Attribute definitions
      # ------------------------------------------------

      AttributeDefinitions:

        # Main key
        - AttributeName: shareId
          AttributeType: S

        # GSI key
        - AttributeName: token
          AttributeType: S

      # ------------------------------------------------
      # Primary key
      # ------------------------------------------------

      KeySchema:

        - AttributeName: shareId
          KeyType: HASH

      # ------------------------------------------------
      # Token GSI
      # ------------------------------------------------

      GlobalSecondaryIndexes:

        - IndexName: token-index

          KeySchema:

            - AttributeName: token
              KeyType: HASH

          Projection:

            ProjectionType: ALL

      # ------------------------------------------------
      # TTL
      # ------------------------------------------------

      TimeToLiveSpecification:

        AttributeName: ttl

        Enabled: true

  # ==================================================
  # S3 PHOTO STORAGE
  # ==================================================

  PhotosBucket:
    Type: AWS::S3::Bucket

    Properties:

      # ------------------------------------------------
      # Private bucket
      # ------------------------------------------------

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      # ------------------------------------------------
      # S3 CORS
      # ------------------------------------------------

      CorsConfiguration:

        CorsRules:

          - AllowedOrigins:

              - "*"

            AllowedMethods:

              - GET
              - PUT

            AllowedHeaders:

              - "*"

            ExposedHeaders:

              - ETag

# ==================================================
# OUTPUTS
# ==================================================

Outputs:

  # ==================================================
  # API GATEWAY URL
  # ==================================================

  ApiUrl:

    Description: API Gateway URL

    Value: !Sub "https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com"

  # ==================================================
  # DYNAMODB
  # ==================================================

  PhotoTable:

    Description: Existing DynamoDB Photo Metadata Table

    Value: "PhotoTable"

  FolderTable:

    Description: Existing DynamoDB Folder Metadata Table

    Value: "FolderTable"

  UsersTable:

    Description: Existing DynamoDB Users Table

    Value: "UsersTable"

  ShareTable:

    Description: DynamoDB table used for photo share links

    Value: !Ref ShareTable

  # ==================================================
  # S3
  # ==================================================

  PhotosBucket:

    Description: S3 Photo Storage Bucket

    Value: !Ref PhotosBucket