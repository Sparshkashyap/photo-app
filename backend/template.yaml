AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: Serverless backend for Photo App

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 20
    MemorySize: 512

    Environment:
      Variables:
        # Existing manually created DynamoDB table
        DYNAMODB_TABLE: PhotoTable

        # Existing manually created Folder table
        FOLDER_TABLE: FolderTable

        # Existing manually created Users table
        USERS_TABLE_NAME: UsersTable

        # S3 bucket managed by this SAM stack
        S3_BUCKET_NAME: !Ref PhotosBucket

        # JWT configuration
        JWT_EXPIRES_IN: "1d"

        # Share links
        #
        # IMPORTANT:
        # Do not hardcode ShareTable here.
        # CloudFormation creates/manages this table.
        #
        SHARE_TABLE_NAME: !Ref ShareTable

        # Frontend URL used for generated share links.
        #
        # IMPORTANT:
        # Replace this with your deployed frontend URL
        # before production deployment.
        #
        # Example:
        # https://your-photo-app.vercel.app
        #
        FRONTEND_URL: ""

Resources:

  # ==================================================
  # API GATEWAY
  # ==================================================

  PhotoApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"

        AllowHeaders:
          - Content-Type
          - Authorization

        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  # ==================================================
  # LAMBDA
  # ==================================================

  PhotoAppFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: .

      Handler: lambda.handler

      Policies:

        # ------------------------------------------------
        # DynamoDB
        #
        # PhotoTable, FolderTable and UsersTable are
        # existing manually-created tables.
        #
        # ShareTable is managed by this SAM stack.
        # ------------------------------------------------

        - Statement:
            Effect: Allow

            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan

            Resource:

              # ------------------------------------------
              # PhotoTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable/index/*"

              # ------------------------------------------
              # FolderTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable/index/*"

              # ------------------------------------------
              # UsersTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable"

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable/index/*"

              # ------------------------------------------
              # ShareTable
              #
              # Dynamically references the table created
              # by this CloudFormation stack.
              # ------------------------------------------

              - !GetAtt ShareTable.Arn

              - !Sub "${ShareTable.Arn}/index/*"

        # ------------------------------------------------
        # S3
        # ------------------------------------------------

        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket

        # ------------------------------------------------
        # SSM Parameter Store
        # ------------------------------------------------

        - Statement:
            Effect: Allow

            Action:
              - ssm:GetParameter

            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/JWT_SECRET"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/MONGO_URI"

      # ------------------------------------------------
      # API ROUTES
      # ------------------------------------------------

      Events:

        Root:
          Type: HttpApi

          Properties:
            ApiId: !Ref PhotoApi

            Path: /

            Method: ANY

        Proxy:
          Type: HttpApi

          Properties:
            ApiId: !Ref PhotoApi

            Path: /{proxy+}

            Method: ANY

  # ==================================================
  # SHARE LINKS TABLE
  # ==================================================

  ShareTable:
    Type: AWS::DynamoDB::Table

    Properties:

      # IMPORTANT:
      # Do NOT specify TableName.
      #
      # CloudFormation will generate the physical table
      # name automatically. This avoids the custom-name
      # replacement problem during future deployments.
      #

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        # Main key
        - AttributeName: shareId
          AttributeType: S

        # GSI key
        - AttributeName: token
          AttributeType: S

      KeySchema:
        - AttributeName: shareId
          KeyType: HASH

      GlobalSecondaryIndexes:

        - IndexName: token-index

          KeySchema:
            - AttributeName: token
              KeyType: HASH

          Projection:
            ProjectionType: ALL

      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ==================================================
  # S3 PHOTO STORAGE
  # ==================================================

  PhotosBucket:
    Type: AWS::S3::Bucket

    Properties:

      # ------------------------------------------------
      # Keep bucket private
      # ------------------------------------------------

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      # ------------------------------------------------
      # S3 CORS
      # ------------------------------------------------

      CorsConfiguration:

        CorsRules:

          - AllowedOrigins:
              - "*"

            AllowedMethods:
              - GET
              - PUT

            AllowedHeaders:
              - "*"

            ExposedHeaders:
              - ETag

# ==================================================
# OUTPUTS
# ==================================================

Outputs:

  # --------------------------------------------------
  # API Gateway URL
  # --------------------------------------------------

  ApiUrl:
    Description: API Gateway URL

    Value: !Sub "https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com"

  # --------------------------------------------------
  # DynamoDB
  # --------------------------------------------------

  PhotoTable:
    Description: Existing DynamoDB Photo Metadata Table

    Value: "PhotoTable"

  FolderTable:
    Description: Existing DynamoDB Folder Metadata Table

    Value: "FolderTable"

  UsersTable:
    Description: Existing DynamoDB Users Table

    Value: "UsersTable"

  ShareTable:
    Description: DynamoDB table used for photo share links

    Value: !Ref ShareTable

  # --------------------------------------------------
  # S3 Bucket
  # --------------------------------------------------

  PhotosBucket:
    Description: S3 Photo Storage Bucket

    Value: !Ref PhotosBucket