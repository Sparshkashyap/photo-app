
AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: Serverless backend for Photo App

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 20 
    MemorySize: 512

    Environment:
      Variables:
        # Existing manually created DynamoDB table
        DYNAMODB_TABLE: PhotoTable

        # Existing manually created Folder table
        FOLDER_TABLE: FolderTable

        # Existing manually created Users table
        USERS_TABLE_NAME: UsersTable

        # S3 bucket managed by this SAM stack
        S3_BUCKET_NAME: !Ref PhotosBucket

        # JWT configuration
        JWT_EXPIRES_IN: "1d"

Resources:

  # ==================================================
  # API GATEWAY
  # ==================================================

  PhotoApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"

        AllowHeaders:
          - Content-Type
          - Authorization

        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS


  # ==================================================
  # LAMBDA
  # ==================================================

  PhotoAppFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: .

      Handler: lambda.handler

      Policies:

        # ------------------------------------------------
        # DynamoDB
        #
        # PhotoTable, FolderTable and UsersTable are
        # existing manually-created tables.
        # ------------------------------------------------

        - Statement:
            Effect: Allow

            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan

            Resource:

              # ------------------------------------------
              # PhotoTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable"

              # PhotoTable GSI
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PhotoTable/index/*"


              # ------------------------------------------
              # FolderTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable"

              # FolderTable GSI
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FolderTable/index/*"


              # ------------------------------------------
              # UsersTable
              # ------------------------------------------

              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable"

              # UsersTable email-index
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UsersTable/index/*"


        # ------------------------------------------------
        # S3
        #
        # S3 bucket is managed by this SAM stack.
        # ------------------------------------------------

        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket


        # ------------------------------------------------
        # SSM Parameter Store
        #
        # JWT_SECRET is currently used by Lambda.
        # MONGO_URI is retained because it exists in
        # Parameter Store and may be used by old code
        # until MongoDB migration is completely removed.
        # ------------------------------------------------

        - Statement:
            Effect: Allow

            Action:
              - ssm:GetParameter

            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/JWT_SECRET"

              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/MONGO_URI"


      # ------------------------------------------------
      # API ROUTES
      # ------------------------------------------------

      Events:

        Root:
          Type: HttpApi

          Properties:
            ApiId: !Ref PhotoApi

            Path: /

            Method: ANY


        Proxy:
          Type: HttpApi

          Properties:
            ApiId: !Ref PhotoApi

            Path: /{proxy+}

            Method: ANY


  # ==================================================
  # S3 PHOTO STORAGE
  # ==================================================

  PhotosBucket:
    Type: AWS::S3::Bucket

    Properties:

      # ------------------------------------------------
      # Keep bucket private
      # ------------------------------------------------

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true


      # ------------------------------------------------
      # S3 CORS
      #
      # Browser uploads directly to S3 using
      # presigned PUT URLs.
      # ------------------------------------------------

      CorsConfiguration:

        CorsRules:

          - AllowedOrigins:
              - "*"

            AllowedMethods:
              - GET
              - PUT

            AllowedHeaders:
              - "*"

            ExposedHeaders:
              - ETag


# ==================================================
# OUTPUTS
# ==================================================

Outputs:

  # --------------------------------------------------
  # API Gateway URL
  # --------------------------------------------------

  ApiUrl:
    Description: API Gateway URL

    Value: !Sub "https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com"


  # --------------------------------------------------
  # DynamoDB
  #
  # External tables — only displaying their names.
  # CloudFormation does NOT create/delete them.
  # --------------------------------------------------

  PhotoTable:
    Description: Existing DynamoDB Photo Metadata Table

    Value: "PhotoTable"


  FolderTable:
    Description: Existing DynamoDB Folder Metadata Table

    Value: "FolderTable"


  UsersTable:
    Description: Existing DynamoDB Users Table

    Value: "UsersTable"


  # --------------------------------------------------
  # S3 Bucket
  # --------------------------------------------------

  PhotosBucket:
    Description: S3 Photo Storage Bucket

    Value: !Ref PhotosBucket