AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: Serverless backend for Photo App

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 20
    MemorySize: 512

    Environment:
      Variables:
        DYNAMODB_TABLE: PhotoTable
        S3_BUCKET_NAME: !Ref PhotosBucket
        JWT_EXPIRES_IN: "1d"

Resources:

  # --------------------------------
  # API Gateway
  # --------------------------------

  PhotoApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"

        AllowHeaders:
          - Content-Type
          - Authorization

        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS


  # --------------------------------
  # Lambda
  # --------------------------------

  PhotoAppFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: .

      Handler: lambda.handler

      Policies:

        # DynamoDB permissions
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable

        # S3 permissions
        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket

        # SSM Parameter Store permissions
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/JWT_SECRET"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/photo-app/MONGO_URI"

      Events:

        Root:
          Type: HttpApi

          Properties:
            ApiId: !Ref PhotoApi
            Path: /
            Method: ANY

        Proxy:
          Type: HttpApi

          Properties:
            ApiId: !Ref PhotoApi
            Path: /{proxy+}
            Method: ANY


  # --------------------------------
  # DynamoDB
  # --------------------------------

  PhotoTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: PhotoTable

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: photoId
          AttributeType: S

      KeySchema:
        - AttributeName: photoId
          KeyType: HASH


  # --------------------------------
  # S3
  # --------------------------------

  PhotosBucket:
    Type: AWS::S3::Bucket

    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"

            AllowedMethods:
              - GET
              - PUT

            AllowedHeaders:
              - "*"

            ExposedHeaders:
              - ETag


# --------------------------------
# Outputs
# --------------------------------

Outputs:

  ApiUrl:
    Description: API Gateway URL

    Value: !Sub "https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com"

  PhotoTable:
    Description: DynamoDB Photo Metadata Table

    Value: !Ref PhotoTable

  PhotosBucket:
    Description: S3 Photo Storage Bucket

    Value: !Ref PhotosBucket

    